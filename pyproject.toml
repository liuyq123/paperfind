[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paperfind"
version = "0.1.0"
description = "Paper recommendation system based on your Zotero library"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["papers", "research", "zotero", "recommendations", "semantic-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "langchain-core>=0.1.0",
    "langchain-openai>=0.0.5",
    "langchain-chroma>=0.1.0",
    "chromadb>=0.4.0",
    "openai>=1.0.0",
    "sentence-transformers>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
ollama = [
    "langchain-ollama>=0.1.0",
]
huggingface = [
    "langchain-huggingface>=0.0.1",
]
postgres = [
    "psycopg[binary]>=3.1.0",
    "pgvector>=0.2.5",
]
all-embeddings = [
    "langchain-ollama>=0.1.0",
    "langchain-huggingface>=0.0.1",
]

[project.scripts]
paperfind = "paperfind.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/paperfind"
Issues = "https://github.com/yourusername/paperfind/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"
