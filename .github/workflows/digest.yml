name: Daily Paper Digest

on:
  schedule:
    # Run daily at 8 AM UTC (adjust timezone as needed)
    - cron: '0 8 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI
    inputs:
      days:
        description: 'Number of days to fetch papers'
        required: false
        default: '1'
      num_results:
        description: 'Number of recommendations'
        required: false
        default: '10'

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run digest
        env:
          # API keys
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          CROSSREF_EMAIL: ${{ secrets.CROSSREF_EMAIL }}
          # Email settings
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # Optional: custom categories
          ARXIV_CATEGORIES: ${{ secrets.ARXIV_CATEGORIES }}
          BIORXIV_CATEGORIES: ${{ secrets.BIORXIV_CATEGORIES }}
        run: |
          paperfind digest \
            --days ${{ github.event.inputs.days || '1' }} \
            -k ${{ github.event.inputs.num_results || '10' }}
